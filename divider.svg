<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5d4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#8b6cff"/>
      <stop offset="0.75" stop-color="#ff4ecd"/>
      <stop offset="1" stop-color="#ff4ecd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dot { animation: slide 4s ease-in-out infinite alternate; }
    @keyframes slide { from { transform: translateX(-380px); } to { transform: translateX(380px); } }
  </style>
  <rect x="0" y="11" width="1200" height="2" fill="url(#d)" opacity="0.8"/>
  <circle class="dot" cx="600" cy="12" r="5" fill="#ffffff"/>
  <circle class="dot" cx="600" cy="12" r="10" fill="#8b6cff" opacity="0.35"/>
</svg>
